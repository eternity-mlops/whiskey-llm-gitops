apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: llm
          image: ghcr.io/eternity-mlops/whiskey-llm:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/home/llamafile/model.llamafile"]
          args:
            - "--server"
            - "--nobrowser"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "$(PORT)"
            - "--unsecure"
            - "-c"
            - "$(CTX_SIZE)"
            - "-t"
            - "$(THREADS)"
          envFrom:
            - configMapRef:
                name: llm-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            periodSeconds: 10